title: atomb-log
description: "의료데이터분석가"
url: "https://atomb-log.github.io"
baseurl: ""
lang: ko-KR
timezone: Asia/Seoul
author:
  name: atomb
github_username: atomb-log

permalink: /notes/:year/:month/:day/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true
excerpt_separator: "<!--more-->"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
  - .local
  - scripts
  - tests
  - LICENSE
  - AGENTS.md
